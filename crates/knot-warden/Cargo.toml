[workspace]

[package]
name = "nocturne-knot-warden"
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/Nocturne-Standards/knot"
description = "Delaying guardian in front of an Atlas registry. Calls Atlas; Atlas does not call it."

# Own workspace. The host tests load atlas.wasm from an Atlas checkout next to this repo
# (Nocturne-Standards/atlas); public knot CI does not check that out. `make test` in this directory.

[dependencies]
knot-warden-encoding = { package = "nocturne-knot-warden-encoding", path = "../knot-warden-encoding", version = "0.2.1", features = ["contract-events"] }
dusk-bls12_381 = { version = "=0.14.2", default-features = false }
rkyv = { version = "=0.7.46", default-features = false, features = ["size_32"] }
bytecheck = { version = "=0.6.12", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
dusk-core = { version = "=1.7.0" }
dusk-data-driver = { version = "0.3", optional = true }
dusk-forge = "0.3.0"
dusk-bytes = "=0.1.7"

[dev-dependencies]
atlas-encoding = { package = "nocturne-atlas-encoding", version = "0.5" }
knot-warden-encoding = { package = "nocturne-knot-warden-encoding", path = "../knot-warden-encoding", version = "0.2.1" }
dusk-core = { version = "=1.7.0", features = ["zk"] }
dusk-vm = { version = "=1.7.0", default-features = false }
dusk-bytes = "=0.1.7"
bytecheck = { version = "=0.6.12", default-features = false }
rand = { version = "0.8.6", default-features = false }
rkyv = { version = "=0.7.46", default-features = false, features = ["size_32", "validation"] }

[features]
contract = ["dusk-core/abi-dlmalloc"]

data-driver = [
  "knot-warden-encoding/data-driver",
  "dusk-core/serde",
  "dep:dusk-data-driver",
  "dusk-data-driver/wasm-export",
  "dep:serde",
  "dusk-bls12_381/serde",
]

data-driver-js = ["data-driver", "dusk-data-driver/alloc"]

[lib]
# Package is nocturne-knot-warden; the Rust name and the built file keep the short name.
name = "knot_warden"
crate-type = ["cdylib", "rlib"]
