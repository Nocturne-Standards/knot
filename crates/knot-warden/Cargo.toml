[workspace]

[package]
name = "knot-warden"
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
publish = false
license = "Apache-2.0"
repository = "https://github.com/Nocturne-Standards/knot"
description = "Delaying guardian in front of an Atlas registry. Calls Atlas; Atlas does not call it."

# Own workspace: path-depends on sibling atlas 0.3 via knot-warden-encoding.
# Public knot CI does not check that sibling out. `make test` in this directory.

[dependencies]
knot-warden-encoding = { path = "../knot-warden-encoding", features = ["contract-events"] }
dusk-bls12_381 = { version = "=0.14.2", default-features = false }
rkyv = { version = "=0.7.39", default-features = false, features = ["size_32"] }
bytecheck = { version = "=0.6.12", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
dusk-core = { version = "=1.6.0" }
dusk-data-driver = { version = "0.3", optional = true }
dusk-forge = "0.3.0"
dusk-bytes = "=0.1.7"

[dev-dependencies]
atlas-encoding = { path = "../../../atlas/crates/atlas-encoding", version = "0.3.0" }
knot-warden-encoding = { path = "../knot-warden-encoding" }
dusk-core = { version = "=1.6.0", features = ["zk"] }
dusk-vm = { version = "=1.6.0", default-features = false }
dusk-bytes = "=0.1.7"
bytecheck = { version = "=0.6.12", default-features = false }
rand = { version = "0.8.6", default-features = false }
rkyv = { version = "=0.7.39", default-features = false, features = ["size_32", "validation"] }

[features]
contract = ["dusk-core/abi-dlmalloc"]

data-driver = [
  "knot-warden-encoding/data-driver",
  "dusk-core/serde",
  "dep:dusk-data-driver",
  "dusk-data-driver/wasm-export",
  "dep:serde",
  "dusk-bls12_381/serde",
]

data-driver-js = ["data-driver", "dusk-data-driver/alloc"]

[lib]
crate-type = ["cdylib", "rlib"]
