[package]
name = "multisig-encoding"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "Apache-2.0"
description = "Canonical §4a proposal preimage + §4b ProposalBlob for the multisig suite"

[dependencies]
tiny-keccak = { version = "2.0", features = ["keccak"] }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
proptest = "1"

[lib]
crate-type = ["rlib"]
