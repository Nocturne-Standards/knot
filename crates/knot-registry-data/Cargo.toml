[package]
name = "knot-registry-data"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "Apache-2.0"
description = "Account book for knot-registry. Writes require the Atlas-resolved logic contract."
repository = "https://github.com/Nocturne-Standards/knot"
build = "build.rs"

[dependencies]
knot-encoding = { path = "../knot-encoding", features = ["call-types"] }

[target.'cfg(target_family = "wasm")'.dependencies]
dusk-core = { version = "1.6", git = "https://github.com/dusk-network/rusk", tag = "dusk-core-1.6.0" }
dusk-forge = "0.3.0"
dusk-bytes = "=0.1.7"

[features]
contract = ["dusk-core/abi-dlmalloc"]
data-driver = []

[lib]
crate-type = ["cdylib", "rlib"]
