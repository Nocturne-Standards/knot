[toolchain]
# 1.94.0 is a wire-format guarantee for this crate's archived (rkyv) types,
# not just a build pin: rustc/rkyv version drift can silently change archived
# struct layout. Re-run every layout golden before bumping this and before
# any deploy that follows.
channel = "1.94.0"
targets = ["wasm32-unknown-unknown"]
components = ["rust-src", "rustfmt", "cargo", "clippy"]
