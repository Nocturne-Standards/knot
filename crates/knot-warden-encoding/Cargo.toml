[workspace]

[package]
name = "knot-warden-encoding"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "Apache-2.0"
repository = "https://github.com/Nocturne-Standards/knot"
description = "Host-visible call types and events for the warden contract (rkyv layout-pinned)"

# Own workspace: path-depends on sibling atlas 0.3, which public knot CI does
# not check out. Parent `cargo test --workspace` must not require it.

[dependencies]
# Sibling checkout of atlas at the 0.3 kernel (Account, SetServiceArgs).
atlas-encoding = { path = "../../../atlas/crates/atlas-encoding", version = "0.3.0" }
dusk-core = { version = "=1.6.0", default-features = false }
dusk-forge = { version = "0.3.0", optional = true }
rkyv = { version = "=0.7.39", default-features = false, features = ["size_32", "alloc", "validation"] }
bytecheck = { version = "=0.6.12", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }

[features]
default = []
data-driver = ["dep:serde", "dusk-core/serde", "atlas-encoding/data-driver"]
contract-events = ["dep:dusk-forge"]

[dev-dependencies]
rand = { version = "0.8.6", default-features = false }
dusk-core = { version = "=1.6.0", features = ["zk"] }

[lib]
crate-type = ["rlib"]
