[workspace]

[package]
name = "nocturne-knot-warden-encoding"
version = "0.2.1"
edition = "2024"
rust-version = "1.94"
publish = false
license = "Apache-2.0"
repository = "https://github.com/Nocturne-Standards/knot"
description = "Host-visible call types and events for the warden contract (rkyv layout-pinned)"

# Own workspace: path-depends on sibling atlas (atlas-encoding 0.4), which public knot CI does
# not check out. Parent `cargo test --workspace` must not require it.

[dependencies]
# Sibling checkout of atlas: atlas-encoding 0.4 (Account, SetServiceArgs).
# The package is nocturne-atlas-encoding; the key keeps the Rust name.
atlas-encoding = { package = "nocturne-atlas-encoding", path = "../../../atlas/crates/atlas-encoding", version = "0.4" }
dusk-core = { version = "=1.7.0", default-features = false }
dusk-forge = { version = "0.3.0", optional = true }
rkyv = { version = "=0.7.46", default-features = false, features = ["size_32", "alloc", "validation"] }
bytecheck = { version = "=0.6.12", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
default = []
data-driver = ["dep:serde", "dusk-core/serde", "atlas-encoding/data-driver"]
contract-events = ["dep:dusk-forge"]
# Bin-only. Writes decoder fixtures from the event structs. Not a default feature.
fixture-gen = ["data-driver", "dep:serde_json"]

[dev-dependencies]
rand = { version = "0.8.6", default-features = false }
dusk-core = { version = "=1.7.0", features = ["zk"] }

[lib]
# Package is nocturne-knot-warden-encoding; the Rust name and the built file keep the short name.
name = "knot_warden_encoding"
crate-type = ["rlib"]

[[bin]]
name = "generate-event-fixtures"
path = "src/bin/generate_event_fixtures.rs"
required-features = ["fixture-gen"]
