[package]
name = "knot-tool"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "Apache-2.0"
description = "Local signing tool and web UI for exercising the multisig suite."
repository = "https://github.com/aichbindas/knot"

[[bin]]
name = "knot-tool"
path = "src/main.rs"

[lib]
name = "knot_tool"
path = "src/lib.rs"

# rkyv/bytecheck/dusk-bls12_381 pinned to the exact versions knot-registry
# uses (its call_types.rs is included directly via #[path = ...] below, same
# convention every other host-side test in this repo already uses) — the wire
# format must match byte-for-byte for the contract to accept our args.
[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dusk-bls12_381 = { version = "=0.14.2", default-features = false }
dusk-bytes = "=0.1.7"
dusk-core = { version = "1.6", git = "https://github.com/dusk-network/rusk", tag = "dusk-core-1.6.0" }
rkyv = { version = "=0.7.39", features = ["size_32", "validation"] }
bytecheck = "=0.6.12"
tiny-keccak = { version = "2", features = ["keccak"] }
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
axum = "0.8"
bs58 = "0.5"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
rpassword = "7"
knot-encoding = { path = "../knot-encoding", features = ["call-types"] }
zeroize = "1"
subtle = "2"
libc = "0.2"
argon2 = "0.5"
directories = "5"

[dev-dependencies]
dusk-vm = { version = "1.6", git = "https://github.com/dusk-network/rusk", tag = "dusk-core-1.6.0", default-features = false }
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
tempfile = "3"

# Silences "unexpected cfg" warnings from knot-registry/src/call_types.rs
# (included via #[path = ...], see src/registry_types.rs) — that crate has a
# real "data-driver" feature we don't need/enable here, but rustc still warns
# about the cfg_attr referencing an unknown feature in *this* crate's build
# unless we declare the name too.
[features]
default = []
data-driver = []
