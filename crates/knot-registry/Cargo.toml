[package]
name = "knot-registry"
version = "0.1.6"
edition = "2024"
rust-version = "1.94"
publish = false
license = "Apache-2.0"
description = "BLS M-of-N quorum verification registry for committee membership."
repository = "https://github.com/aichbindas/knot"

# -----------------------------------------------------------------------------
# Regular dependencies — BLS types (BlsPublicKey/BlsSignature) need
# Archive/Serialize/Deserialize for call_types.rs's structs to cross the
# wire. Versions pinned to match identity-credential/compliance-gate/
# prediction-market exactly (same dusk-core release family).
# -----------------------------------------------------------------------------
[dependencies]
dusk-bls12_381 = { version = "=0.14.2", default-features = false }
rkyv = { version = "=0.7.46", default-features = false, features = ["size_32"] }
bytecheck = { version = "=0.8.2", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
knot-encoding = { path = "../knot-encoding", features = ["call-types"] }

# -----------------------------------------------------------------------------
# WASM Dependencies (contract is gated by #![cfg(target_family = "wasm")])
# -----------------------------------------------------------------------------
[target.'cfg(target_family = "wasm")'.dependencies]
dusk-core = { version = "1.6", git = "https://github.com/dusk-network/rusk", tag = "dusk-core-1.6.0" }
dusk-data-driver = { version = "1.7", optional = true }
dusk-forge = "0.3.0"
dusk-bytes = "=0.1.7"

# -----------------------------------------------------------------------------
# Dev Dependencies (host-side tests)
# -----------------------------------------------------------------------------
[dev-dependencies]
dusk-core = { version = "1.6", git = "https://github.com/dusk-network/rusk", tag = "dusk-core-1.6.0", features = ["zk"] }
dusk-vm = { version = "1.6", git = "https://github.com/dusk-network/rusk", tag = "dusk-core-1.6.0", default-features = false }
dusk-bytes = "=0.1.7"
rand = { version = "0.10.2", default-features = false }

# -----------------------------------------------------------------------------
# Features
# -----------------------------------------------------------------------------
[features]
contract = ["dusk-core/abi-dlmalloc"]

data-driver = [
  "dusk-core/serde",
  "dep:dusk-data-driver",
  "dusk-data-driver/wasm-export",
  "dep:serde",
  "dusk-bls12_381/serde",
  "knot-encoding/data-driver",
]

data-driver-js = ["data-driver", "dusk-data-driver/alloc"]

[lib]
crate-type = ["cdylib", "rlib"]
