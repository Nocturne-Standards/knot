---
name: Feature request
description: Suggest an improvement or new capability
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Likely scope
      options:
        - knot-tool (CLI / Lab)
        - knot-collector
        - knot-encoding
        - knot-registry / knot-proposals (contracts)
        - Documentation
        - CI / packaging
        - Unsure
    validations:
      required: true

  - type: checkboxes
    id: contracts
    attributes:
      label: Contract impact
      options:
        - label: This would require a contract redeploy or signing-domain change
          required: false
