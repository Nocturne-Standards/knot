name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit/design SHA stamps
        run: scripts/check-audit-sha.sh
      - name: Public-surface leak gate
        env:
          # Soften private-tier patterns until launch squash; credentials still hard-fail.
          ALLOW_PRIVATE_TIER: "1"
        run: scripts/check-public-surface.sh
      - name: Crate version table vs Cargo.toml
        run: scripts/check-crate-version-table.sh
      - name: Shared-code ratchet
        run: scripts/check-repo-rules.sh
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    env:
      # libgit2 ignores url.insteadOf; force cargo to shell out to git.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          targets: wasm32-unknown-unknown
      - name: Private deps auth
        env:
          TOKEN: ${{ secrets.GH_PRIVATE_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::GH_PRIVATE_REPO_TOKEN secret is unset or empty"
            echo "Need a PAT (or fine-grained token) with contents:read on private aichbindas/nocturne-deployments."
            exit 1
          fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      # Workspace root = knot nest. Collector is AGPL; encoding/registry/proposals/tool Apache.
      # Contract tests `include_bytes!` release WASM under nest `target/contract/`.
      - name: build contract WASM
        run: |
          make -C crates/multisig-registry wasm
          make -C crates/multisig-proposals wasm
          make -C crates/multisig-proposals/test-target wasm
        timeout-minutes: 30
      - name: cargo test (workspace)
        run: cargo test
        timeout-minutes: 45
