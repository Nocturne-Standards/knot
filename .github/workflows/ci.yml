name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          targets: wasm32-unknown-unknown
      # Workspace root = knot nest. Collector is AGPL; encoding/registry/proposals/tool Apache.
      # Contract tests `include_bytes!` release WASM under nest `target/contract/`.
      - name: build contract WASM
        run: |
          make -C crates/multisig-registry wasm
          make -C crates/multisig-proposals wasm
          make -C crates/multisig-proposals/test-target wasm
        timeout-minutes: 30
      - name: cargo test (workspace)
        run: cargo test
        timeout-minutes: 45
