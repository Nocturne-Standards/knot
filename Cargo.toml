[workspace]
resolver = "2"
members = [
    "crates/knot-encoding",
    "crates/knot-registry",
    "crates/knot-proposals",
    "crates/knot-tool",
    "crates/knot-collector",
]

# Contract pins: knot-tool default build reads deployments/testnet.json via a
# local loader (NOCTURNE_DEPLOYMENTS / walk-up). Optional feature
# `deployments-crate` uses the public Nocturne-Standards/nocturne-deployments crate.

[workspace.package]
edition = "2024"
rust-version = "1.94"
