[workspace]
resolver = "2"
members = [
    "crates/knot-encoding",
    "crates/knot-registry",
    "crates/knot-proposals",
    "crates/knot-tool",
    "crates/knot-collector",
]

# Contract pins: knot-tool loads pins via the sibling `nocturne-deployments` crate
# (path dep — clone that repo next to `knot`; public CI without the sibling
# cannot compile knot-tool).

[workspace.package]
edition = "2024"
rust-version = "1.94"
