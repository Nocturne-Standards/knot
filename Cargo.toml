[workspace]
resolver = "2"
members = [
    "crates/knot-encoding",
    "crates/knot-registry",
    "crates/knot-registry-data",
    "crates/knot-proposals",
    "crates/knot-proposals-data",
    "crates/knot-mock-atlas",
    "crates/knot-tool",
    "crates/knot-collector",
]

# Contract pins: knot-tool default build reads deployments/testnet.json via a
# local loader (NOCTURNE_DEPLOYMENTS / walk-up). Optional feature
# `deployments-crate` uses the public Nocturne-Standards/nocturne-deployments crate.

# knot-warden and knot-warden-encoding are separate workspaces (each Cargo.toml
# has [workspace]). They path-depend on a sibling atlas 0.3 checkout, which
# public CI does not have. Build with `make -C crates/knot-warden test`.

[workspace.package]
edition = "2024"
rust-version = "1.94"
