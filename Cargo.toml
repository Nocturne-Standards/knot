[workspace]
resolver = "2"
members = [
    "crates/knot-encoding",
    "crates/knot-registry",
    "crates/knot-registry-data",
    "crates/knot-proposals",
    "crates/knot-proposals-data",
    "crates/knot-mock-atlas",
    "crates/knot-tool",
    "crates/knot-collector",
]

# Contract ids are not in this repo: knot-tool reads KNOT_REGISTRY_ID and
# KNOT_PROPOSALS_ID from the environment. Dusk node URL and chain id come from
# the vendored network data in crates/knot-tool/data/dusk-networks/.

# knot-warden and knot-warden-encoding (packages nocturne-knot-warden,
# nocturne-knot-warden-encoding) are separate workspaces (each Cargo.toml
# has [workspace]). They path-depend on a sibling atlas checkout, which
# public CI does not have. Build with `make -C crates/knot-warden test`.
#
# knot-event-decoder is its own workspace for the same reason: it
# path-depends on knot-warden-encoding. `cargo test -p nocturne-knot-event-decoder`
# from `crates/knot-event-decoder`.

[workspace.package]
edition = "2024"
rust-version = "1.94"
