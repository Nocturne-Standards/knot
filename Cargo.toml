[workspace]
resolver = "2"
members = [
    "crates/multisig-encoding",
    "crates/multisig-registry",
    "crates/multisig-proposals",
    "crates/multisig-tool",
    "crates/multisig-collector",
]

# Pins: multisig-tool depends on aichbindas/nocturne-deployments (git).
# Local: optional [patch] or NOCTURNE_DEPLOYMENTS env for pin JSON.
# CI: GH_PRIVATE_REPO_TOKEN (see .github/workflows/ci.yml).

[workspace.package]
edition = "2024"
rust-version = "1.94"
