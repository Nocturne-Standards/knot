[workspace]
resolver = "2"
members = [
    "crates/knot-encoding",
    "crates/knot-registry",
    "crates/knot-proposals",
    "crates/knot-tool",
    "crates/knot-collector",
]

# Pins: knot-tool depends on aichbindas/nocturne-deployments (git).
# Local: optional [patch] or NOCTURNE_DEPLOYMENTS env for pin JSON.
# CI: GH_PRIVATE_REPO_TOKEN (see .github/workflows/ci.yml).

[workspace.package]
edition = "2024"
rust-version = "1.94"
