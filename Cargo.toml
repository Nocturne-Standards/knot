[workspace]
resolver = "2"
members = [
    "crates/knot-encoding",
    "crates/knot-registry",
    "crates/knot-proposals",
    "crates/knot-tool",
    "crates/knot-collector",
]

# Contract pins: knot-tool loads `deployments/testnet.json` via NOCTURNE_DEPLOYMENTS
# or walk-up discovery (no private git fetch by default). Optional
# `--features deployments-crate` on knot-tool opts into nocturne-deployments git dep.

[workspace.package]
edition = "2024"
rust-version = "1.94"
