[workspace]
resolver = "2"
members = [
    "crates/multisig-encoding",
    "crates/multisig-registry",
    "crates/multisig-proposals",
    "crates/multisig-tool",
    "crates/multisig-collector",
]

# Local symlink `deployments` → aichbindas/nocturne-deployments (gitignored).
# Or set NOCTURNE_DEPLOYMENTS. Path dep expects worktree/deployments/...

[workspace.package]
edition = "2024"
rust-version = "1.94"
