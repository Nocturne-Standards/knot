[package]
name = "knot-evm-root-e2e"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone testnet e2e helper; not a member of the knot workspace.
[workspace]

[dependencies]
dusk-core = { version = "1.6", git = "https://github.com/dusk-network/rusk", tag = "dusk-core-1.6.0" }
knot-encoding = { path = "../../crates/knot-encoding", features = ["call-types"] }
bls12_381-bls = { version = "=0.6.0", default-features = false }
dusk-bls12_381 = { version = "=0.14.2", default-features = false, features = ["alloc", "pairings"] }
dusk-bytes = "=0.1.7"
rkyv = { version = "=0.7.39", default-features = false, features = ["size_32", "alloc"] }
rand = "0.8"
tiny-keccak = { version = "2", features = ["keccak"] }
