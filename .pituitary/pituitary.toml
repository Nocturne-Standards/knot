# Curated Pituitary sources for knot
schema_version = 3

[workspace]
root = "."
index_path = ".pituitary/pituitary.db"

[runtime.embedder]
provider = "fixture"
model = "fixture-8d"
timeout_ms = 1000
max_retries = 0

[[sources]]
name = "design-contracts"
adapter = "filesystem"
kind = "markdown_contract"
role = "canonical"
path = "."
files = [
  "docs/security-audit-2026-07-28.md",
  "docs/security-model.md",
]

[[sources]]
name = "frozen-plans"
adapter = "filesystem"
kind = "markdown_docs"
role = "historical"
path = "."
files = [
  "docs/security-audit-2026-07-28-fix-plan.md",
]

[[sources]]
name = "living-core"
adapter = "filesystem"
kind = "markdown_docs"
role = "current_state"
path = "."
files = [
  "README.md",
  "AGENTS.md",
]

[[sources]]
name = "crate-readmes"
adapter = "filesystem"
kind = "markdown_docs"
role = "current_state"
path = "."
files = [
  "crates/knot-collector/README.md",
  "crates/knot-encoding/README.md",
  "crates/knot-proposals/README.md",
  "crates/knot-registry/README.md",
  "crates/knot-tool/README.md",
]

